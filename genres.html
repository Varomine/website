<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeLuxe - Genres</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'">Anime<span>Luxe</span></div>
            <div class="nav-right">
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="genres.html">Genres</a></li>
                        <li id="nav-bookmark" style="display: none;"><a href="index.html?page=bookmarks">Bookmarks</a></li>
                    </ul>
                </nav>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search anime..." onkeypress="checkSearchEnter(event)">
                </div>
                <div id="auth-buttons" style="display: flex; gap: 10px; margin-left: 15px;">
                    <button id="btn-login" class="btn-secondary" onclick="openAuthModal('login')">Login</button>
                    <button id="btn-signup" class="btn-watch-now" style="padding: 8px 15px; font-size: 0.9em;" onclick="openAuthModal('signup')">Sign Up</button>
                </div>

                <div id="user-profile" style="display: none; align-items: center; gap: 15px; margin-left: 15px;">
                    <span id="user-email" style="color: var(--accent); font-size: 0.9rem; font-weight: 500;"></span>
                    <button id="btn-logout" class="btn-secondary" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </header>
  
    <main id="genres-content" class="genres-page">
        <div class="genres-header">
            <h1 class="section-title" style="padding-bottom: 0;">Explore Genres</h1>
            <div id="genres-tags-container" class="tags-container">
                </div>
        </div>
        
        <div id="genres-results">
            </div>
            
    </main>
    
    <div id="loading-overlay" class="modal-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading Anime Assets...</p>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            <p class="progress-text">0% complete</p>
        </div>
    </div>

    <div id="auth-modal" class="auth-modal" style="display: none;">
        <div class="auth-box">
            <span class="close-modal" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></span>
            <h2 id="auth-title">Login</h2>
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <input type="email" id="auth-email" class="auth-input" placeholder="Email" required>
                <input type="password" id="auth-password" class="auth-input" placeholder="Password" required>
                <button type="submit" id="auth-submit-btn" class="auth-btn">Login</button>
            </form>
            <p class="auth-switch" id="auth-switch-text" onclick="toggleAuthMode()">
                Don't have an account? <span>Sign Up</span>
            </p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
