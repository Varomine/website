<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime JSON Generator (Compact Format)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        textarea { width: 100%; height: 200px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; box-sizing: border-box; font-family: monospace; font-size: 12px; }
        .actions { text-align: center; margin-bottom: 20px; }
        button { background-color: #4CAF50; color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background-color: #45a049; transform: translateY(-1px); }
        .copy-btn { background-color: #008CBA; margin-left: 10px; }
        #output { 
            width: 100%; height: 400px; background: #1e1e1e; color: #d4d4d4; 
            padding: 15px; border-radius: 8px; font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 14px; box-sizing: border-box; overflow: auto; white-space: pre;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Anime JSON Generator</h2>
    <div class="grid">
        <div>
            <label>Server 1</label>
            <textarea id="sv1" placeholder="วางลิงก์..."></textarea>
        </div>
        <div>
            <label>Server 2</label>
            <textarea id="sv2" placeholder="วางลิงก์..."></textarea>
        </div>
        <div>
            <label>Server 3</label>
            <textarea id="sv3" placeholder="วางลิงก์..."></textarea>
        </div>
    </div>

    <div class="actions">
        <button onclick="generateJSON()">Generate JSON</button>
        <button class="copy-btn" onclick="copyToClipboard()">Copy JSON</button>
    </div>

    <div id="output">JSON จะแสดงที่นี่...</div>
</div>

<script>
    function generateJSON() {
        const getLinks = (id) => document.getElementById(id).value.trim().split('\n').map(l => l.trim()).filter(l => l !== "");
        
        let s1 = getLinks('sv1').reverse();
        let s2 = getLinks('sv2').reverse();
        let s3 = getLinks('sv3').reverse();

        const maxEpisodes = Math.max(s1.length, s2.length, s3.length);
        
        if (maxEpisodes === 0) {
            document.getElementById('output').innerText = "กรุณาใส่ลิงก์อย่างน้อย 1 ช่อง";
            return;
        }

        let result = [];
        for (let i = 0; i < maxEpisodes; i++) {
            result.push({
                "ep_num": i + 1,
                "title": `Episode ${i + 1}`,
                "servers": [
                    { "name": "Server 1", "video_url": s1[i] || "" },
                    { "name": "Server 2", "video_url": s2[i] || "" },
                    { "name": "Server 3", "video_url": s3[i] || "" }
                ]
            });
        }

        let jsonString = JSON.stringify(result, null, 2);

        let compactJson = jsonString.replace(/\{\s+"name":\s+"([^"]+)",\s+"video_url":\s+"([^"]+)"\s+\}/g, '{ "name": "$1", "video_url": "$2" }');

        document.getElementById('output').innerText = compactJson;
    }

    function copyToClipboard() {
        const text = document.getElementById('output').innerText;
        if (text.startsWith("JSON จะแสดง") || text === "") return;
        
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = originalText, 2000);
        });
    }
</script>

</body>
</html>
